name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test (all 30 chambers are solved by the bot)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/TimeMaze.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TimeMaze-apk
          path: out/TimeMaze.apk

  web:
    name: Web (browser / iPhone Safari)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile the game to JavaScript (TeaVM)
        run: mvn -B -f web/pom.xml package

      - uses: actions/upload-artifact@v4
        with:
          name: TimeMaze-web
          path: web/target/webapp

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/target/webapp

  ios:
    name: iOS app
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TimeMaze-web
          path: ios/TimeMaze/www

      - name: Generate the Xcode project
        run: |
          rm -f ios/TimeMaze/www/sw.js
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for the iOS Simulator
        run: |
          xcodebuild -project ios/TimeMaze.xcodeproj -scheme TimeMaze -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/sim CODE_SIGNING_ALLOWED=NO build

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project ios/TimeMaze.xcodeproj -scheme TimeMaze -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package unsigned IPA
        run: |
          mkdir -p out/Payload
          cp -R ios/build/device/Build/Products/Release-iphoneos/TimeMaze.app out/Payload/
          cd out && zip -qry TimeMaze-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TimeMaze-ios
          path: out/TimeMaze-unsigned.ipa

  pages:
    name: Publish web version on GitHub Pages
    needs: web
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    # needs Settings > Pages > Source: "GitHub Actions"; skipped quietly until then
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Publish release
    needs: [android, web, ios]
    if: always() && needs.android.result == 'success' && github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p out
          cp artifacts/TimeMaze-apk/TimeMaze.apk out/
          if [ -d artifacts/TimeMaze-web ]; then (cd artifacts/TimeMaze-web && zip -qr ../../out/TimeMaze-web.zip .); fi
          if [ -f artifacts/TimeMaze-ios/TimeMaze-unsigned.ipa ]; then cp artifacts/TimeMaze-ios/TimeMaze-unsigned.ipa out/; fi
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          # "r" prefix keeps these clear of the build-N tags made by the older android.yml workflow
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('r{0}', github.run_number) }}
          name: Time Maze ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('release {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: out/*
